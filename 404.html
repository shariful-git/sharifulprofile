<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFFFFF">
  <title>Page Not Found — Md Shariful Islam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .error-page { min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
    .error-card { width: min(620px, 100%); text-align: center; }
    .error-code { display: block; font-family: 'JetBrains Mono', monospace; color: var(--accent); letter-spacing: .12em; margin-bottom: 1rem; }
    .error-card h1 { font-size: clamp(2.6rem, 9vw, 5rem); margin-bottom: 1rem; }
    .error-card p { color: var(--text-dim); max-width: 480px; margin: 0 auto 2rem; }
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-card">
      <span class="error-code">ERROR 404</span>
      <h1>This page took a detour.</h1>
      <p>The address may have changed, but the portfolio is still right where you left it.</p>
      <a class="btn btn--primary" href="index.html">Return to portfolio →</a>
    </div>
  </main>
</body>
</html>
